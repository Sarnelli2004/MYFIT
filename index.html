<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyFit">
<link rel="manifest" href="manifest-myfit.webmanifest">
<link rel="apple-touch-icon" href="icona-myfit-180.png">
<link rel="icon" href="icona-myfit-192.png">
<title>MyFit</title>
<script src="myfit.js"></script>
<script src="dieta.js"></script>
<script src="firebase-config.js"></script>
<script src="punti.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: al primo avvio registrazione a schermate singole (una domanda per volta, pulsante in basso),
   poi questionario sulla dieta; dopo, dashboard a schede: obiettivo e macro, oggi (menu + allenamento), peso, preferenze, profilo */
:root{
  --bg:#f1f3ee; --surface:#ffffff; --ink:#18231c; --muted:#5d6a61; --line:#dce2d8;
  --accent:#2f6b4f; --accent-soft:#e0ede5; --warm:#d27a2c; --warm-soft:#fbecdc;
  --ok:#2f7a4f; --warn:#b7791f; --bad:#b4442f; --steel:#3b4a5c; --steel-soft:#e4e8ee;
  --c-prot:#2f6b4f; --c-carb:#d27a2c; --c-fat:#6b7fa0; --gold:#a77a10; --gold-soft:#f6ecd2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a201c; --ink:#e6ece7; --muted:#9aa79e; --line:#2a332d;
  --accent:#7cc4a0; --accent-soft:#1f3128; --warm:#f0a65a; --warm-soft:#33271a;
  --ok:#6cc993; --warn:#e3b04f; --bad:#ec8a72; --steel:#a9bbd0; --steel-soft:#232b33;
  --c-prot:#7cc4a0; --c-carb:#f0a65a; --c-fat:#9db0d0; --gold:#e3bf5c; --gold-soft:#332a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a201c; --ink:#e6ece7; --muted:#9aa79e; --line:#2a332d;
  --accent:#7cc4a0; --accent-soft:#1f3128; --warm:#f0a65a; --warm-soft:#33271a;
  --ok:#6cc993; --warn:#e3b04f; --bad:#ec8a72; --steel:#a9bbd0; --steel-soft:#232b33;
  --c-prot:#7cc4a0; --c-carb:#f0a65a; --c-fat:#9db0d0; --gold:#e3bf5c; --gold-soft:#332a14; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);font-weight:600;padding:12px 16px;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.small{padding:8px 12px;font-size:.88rem}
.btn.link{border:0;background:none;color:var(--accent);padding:6px 0}
.btn:disabled{opacity:.45;cursor:default}
.note{color:var(--muted);font-size:.82rem;margin:0}
.err{color:var(--bad);font-size:.9rem;margin:0}

/* ---------- registrazione e questionario ---------- */
.flow{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 16px}
.flow-top{display:flex;align-items:center;gap:12px;padding:14px 0 8px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;display:grid;gap:6px}
.prog .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.prog small{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding:14px 0 24px}
.kicker{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--accent)}
.q{font-weight:800;font-size:1.9rem;line-height:1.12;letter-spacing:-.015em}
.qsub{color:var(--muted);margin:-8px 0 0}
.fields{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:6px;min-width:0}
.fld label{font-size:.85rem;font-weight:600;color:var(--muted)}
.inp{position:relative}
.inp input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 46px 16px 16px;font-size:1.15rem;font-weight:600}
.inp.noun input{padding-right:16px}
.inp small{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;cursor:pointer}
.opt .ico{grid-row:span 2;width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1rem}
.opt b{font-weight:600;font-size:1.02rem}
.opt span{font-size:.85rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .ico{background:var(--accent);color:var(--bg)}
.opt.compact{grid-template-columns:1fr auto;padding:13px 16px}
.opt.compact .tick{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center}
.opt.compact[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.opt.compact .tick svg{width:14px;height:14px;fill:none;stroke:var(--bg);stroke-width:3}
.opt.compact:not([aria-pressed="true"]) .tick svg{visibility:hidden}
.flow-bottom{position:sticky;bottom:0;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:grid;gap:8px}
.flow-bottom .btn{width:100%;padding:15px}
.result{background:var(--accent);color:var(--bg);border-radius:22px;padding:22px;display:grid;gap:14px}
.result .big{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:-.02em}
.result .big small{font:600 1.05rem var(--f-body);margin-left:6px;opacity:.85}
.result p{margin:0;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.chip.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* ---------- dashboard ---------- */
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;flex:none}
.top h1{font-weight:800;font-size:1.5rem;line-height:1.1}
.top p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.card h2{font-weight:600;font-size:1.1rem}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.goal .kc{font-family:var(--f-display);font-weight:800;font-size:2.8rem;line-height:1;letter-spacing:-.02em}
.goal .kc small{font:600 1rem var(--f-body);color:var(--muted);margin-left:6px}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mac{display:grid;gap:5px;min-width:0}
.mac span{font-size:.78rem;color:var(--muted);font-weight:600}
.mac b{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.mac i{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mac i em{display:block;height:100%;border-radius:99px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.mini span{display:block;font-size:.75rem;color:var(--muted)}
.mini b{font-weight:600}
.pill{display:inline-block;font-size:.7rem;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.pill.warn{background:var(--warm-soft);color:var(--warm)}
.today{display:grid;grid-template-columns:1fr;gap:12px}
.today>*{min-width:0}
.tile{grid-template-columns:minmax(0,1fr)}
.mlist li{min-width:0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px;text-decoration:none;color:var(--ink)}
.tile .hd{display:flex;align-items:center;gap:10px}
.tile .hd svg{width:22px;height:22px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile.d .hd svg{stroke:var(--accent)} .tile.w .hd svg{stroke:var(--warm)}
.tile h3{font-weight:600;font-size:1.05rem;flex:1}
.tile .go{font-size:.85rem;font-weight:600;color:var(--accent)}
.tile.w .go{color:var(--warm)}
.tile .ttl{font-weight:600}
.mlist{list-style:none;margin:0;padding:0;display:grid}
.mlist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.mlist li span{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist li b{font-weight:600;white-space:nowrap}
.ptsCard{grid-template-columns:auto 1fr auto;align-items:center;text-decoration:none;color:var(--ink);background:var(--gold-soft);border-color:transparent}
.lvb{width:48px;height:48px;border-radius:14px;background:var(--gold);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.pinfo{display:grid;gap:3px;min-width:0}
.pinfo b{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.1}
.pbar{display:block;height:6px;border-radius:99px;background:color-mix(in srgb,var(--gold) 22%,transparent);overflow:hidden}
.pbar em{display:block;height:100%;background:var(--gold);border-radius:99px}
.streak{text-align:center;font-weight:800;font-family:var(--f-display);color:var(--gold);font-size:1.2rem;line-height:1.1}
.streak small{display:block;font:600 .7rem var(--f-body);color:var(--muted)}
.diaryCta{grid-template-columns:1fr auto;align-items:center;text-decoration:none;color:var(--ink)}
.diaryCta b{display:block;font-weight:600}
.diaryCta .go{font-weight:600;color:var(--accent);font-size:.9rem}
.remind{background:var(--warm-soft);border-color:transparent;grid-template-columns:1fr auto;align-items:center}
.remind p{margin:0} .remind b{display:block}
.wnow{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1}
.wnow small{font:600 .95rem var(--f-body);color:var(--muted);margin-left:4px}
.delta{font-weight:600;font-size:.88rem;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.delta.down{background:var(--warm-soft);color:var(--warm)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:var(--accent);opacity:.12}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart text{fill:var(--muted);font:500 11px var(--f-body)}
.empty{color:var(--muted);font-size:.9rem;margin:0;background:var(--bg);border-radius:12px;padding:12px}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.hist .d{color:var(--muted)}
.hist .ch{font-size:.8rem;color:var(--muted);min-width:56px;text-align:right}
.advice{border-radius:12px;padding:12px;background:var(--bg);display:grid;gap:8px;font-size:.92rem}
.advice p{margin:0} .advice.ok{background:var(--accent-soft)} .advice.act{background:var(--warm-soft)}
.wform{display:grid;gap:12px}
.wform .inp input{padding:12px 42px 12px 12px;font-size:1rem;background:var(--bg)}
.wform .inp.noun input{padding-right:12px}
.prof{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;margin:0}
.prof div{min-width:0} .prof dt{font-size:.75rem;color:var(--muted)} .prof dd{margin:0;font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:600;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (min-width:520px){.today{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.prog .bar span{transition:none}}
</style>
</head>
<body>

<!-- REGISTRAZIONE + QUESTIONARIO -->
<div class="flow" id="flow" hidden>
  <div class="flow-top">
    <button class="back" type="button" id="back" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="prog"><small id="progT"></small><div class="bar"><span id="progB"></span></div></div>
  </div>
  <form class="screen" id="screen" novalidate></form>
</div>

<!-- DASHBOARD -->
<div class="wrap" id="dash" hidden>
  <div class="top"><div class="avatar" id="avatar"></div><div><h1 id="hello"></h1><p id="today"></p></div></div>

  <div class="card goal">
    <div class="row"><span class="eyebrow">Obiettivo di ogni giorno</span><span class="eyebrow" id="goalName"></span></div>
    <div class="kc num" id="kcal"></div>
    <div class="macro" id="macro"></div>
    <div class="minis">
      <div class="mini"><span>Peso</span><b class="num" id="mPeso"></b></div>
      <div class="mini"><span>BMI</span><b class="num" id="mBmi"></b></div>
      <div class="mini"><span>Mantenimento</span><b class="num" id="mTdee"></b></div>
    </div>
  </div>

  <a class="card ptsCard" href="classifica.html">
    <div class="lvb num" id="pLv"></div>
    <div class="pinfo"><span class="eyebrow">Livello · <span id="pName"></span></span><b class="num" id="pTot"></b><i class="pbar"><em id="pBar"></em></i><span class="note" id="pNext"></span></div>
    <div class="streak num" id="pStreak"></div>
  </a>
  <a class="card diaryCta" href="diario.html" id="dCta"><div><b id="dTitle">Diario di oggi</b><span class="note" id="dSub"></span></div><span class="go">Apri</span></a>

  <div class="card remind" id="remind" hidden>
    <p><b>È ora del controllo mensile</b><span class="note" id="remS"></span></p>
    <button class="btn primary small" type="button" data-open-w>Registra</button>
  </div>

  <div class="today">
    <a class="tile d" href="pasti.html">
      <div class="hd"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M16 21V3c2.5 1.5 3.5 4 3.5 7.5S18 14 16 14"/></svg><h3>Menu di oggi</h3><span class="go">Apri</span></div>
      <div class="ttl" id="tdTitle"></div>
      <ul class="mlist num" id="tdMeals"></ul>
    </a>
    <a class="tile w" href="allenamento.html">
      <div class="hd"><svg viewBox="0 0 24 24"><path d="M3 9.5v5M6 7v10M18 7v10M21 9.5v5M6 12h12"/></svg><h3>Allenamento di oggi</h3><span class="go">Apri</span></div>
      <div class="ttl" id="twTitle"></div>
      <p class="note" id="twSub"></p>
      <p class="note" id="twNext"></p>
    </a>
  </div>

  <div class="card" id="wCard">
    <div class="row"><h2>Il tuo peso</h2><span class="note" id="next"></span></div>
    <div class="row" style="align-items:center"><div class="wnow num" id="wnow"></div><span class="delta num" id="delta" hidden></span></div>
    <div id="chartBox"></div>
    <div id="advice"></div>
    <form class="wform" id="wForm" hidden>
      <div class="f2">
        <div class="fld"><label for="wKg">Peso</label><div class="inp"><input id="wKg" inputmode="decimal" placeholder="60"><small>kg</small></div></div>
        <div class="fld"><label for="wDate">Data</label><div class="inp noun"><input id="wDate" type="date"></div></div>
      </div>
      <div class="fld"><label for="wH">Altezza (solo se è cambiata)</label><div class="inp"><input id="wH" inputmode="numeric" placeholder="170"><small>cm</small></div></div>
      <p class="err" id="wErr" hidden></p>
      <div class="row" style="justify-content:flex-start"><button class="btn primary" type="submit">Salva peso</button><button class="btn" type="button" id="wCancel">Annulla</button></div>
    </form>
    <button class="btn primary" type="button" id="wOpen" data-open-w>Registra peso</button>
    <ul class="hist num" id="hist"></ul>
  </div>

  <div class="card">
    <div class="row"><h2>Le tue preferenze</h2><button class="btn link" type="button" id="redoQ">Rifai il questionario</button></div>
    <div class="chips" id="prefs"></div>
  </div>

  <div class="card">
    <div class="row"><h2>Profilo</h2><button class="btn link" type="button" id="edit">Modifica</button></div>
    <dl class="prof" id="prof"></dl>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const M=window.MyFit, D=window.Dieta, $=id=>document.getElementById(id), DAY=864e5;
const fmtD=(t,o={day:"numeric",month:"short"})=>new Date(t).toLocaleDateString("it-IT",o);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN};
const isoToday=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const GIORNI=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let P=M.load();

/* =================== REGISTRAZIONE E QUESTIONARIO =================== */
// stato del flusso: dati provvisori (draft) e risposte (ans)
let mode="reg", step=0, draft={}, ans={};
const REG=[
 {id:"nome",kicker:"Benvenuto in MyFit",q:"Come ti chiami?",sub:"Ti serve un minuto: poi calcolo le tue calorie e prepariamo la dieta insieme.",
  html:()=>`<div class="fields"><div class="fld"><label for="nome">Nome</label><div class="inp noun"><input id="nome" autocomplete="given-name" value="${esc(draft.nome)}" placeholder="Il tuo nome"></div></div>
    <div class="fld"><label for="cognome">Cognome</label><div class="inp noun"><input id="cognome" autocomplete="family-name" value="${esc(draft.cognome)}" placeholder="Il tuo cognome"></div></div></div>`,
  read:()=>{draft.nome=$("nome").value.trim();draft.cognome=$("cognome").value.trim();
    return !draft.nome?"Scrivi il tuo nome.":!draft.cognome?"Scrivi il tuo cognome.":""}},
 {id:"chi",kicker:"Su di te",q:()=>`Piacere, ${draft.nome}. Qualcosa su di te`,sub:"Sesso ed età servono per calcolare quante calorie consumi.",
  html:()=>`<div class="opts" role="radiogroup" aria-label="Sesso">${opt("sesso","M","Uomo","","U")}${opt("sesso","F","Donna","","D")}</div>
    <div class="fld"><label for="eta">Età</label><div class="inp"><input id="eta" inputmode="numeric" value="${draft.eta??""}" placeholder="27"><small>anni</small></div></div>`,
  read:()=>{draft.eta=Math.round(num($("eta").value));return !draft.sesso?"Scegli uomo o donna.":!(draft.eta>=14&&draft.eta<=90)?"Inserisci un'età tra 14 e 90 anni.":""}},
 {id:"corpo",kicker:"Il tuo corpo",q:"Quanto sei alto e quanto pesi?",sub:"Pesati al mattino, a digiuno: sarà il tuo punto di partenza.",

function chart(pts){
  const W=320,H=150,L=34,R=12,T=14,B=24,xs=pts.map(p=>p.d),ys=pts.map(p=>p.kg);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1-x0<7*DAY)x1=x0+7*DAY;
  let lo=Math.min(...ys),hi=Math.max(...ys);const pad=Math.max(.5,(hi-lo)*.25);lo=Math.floor((lo-pad)*2)/2;hi=Math.ceil((hi+pad)*2)/2;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B),ticks=[lo,(lo+hi)/2,hi];
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(p.d).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
  const area=line+`L${X(pts[pts.length-1].d).toFixed(1)},${H-B}L${X(pts[0].d).toFixed(1)},${H-B}Z`,last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del peso">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${M.fmt(v,v%1?1:0)}</text>`).join("")}
    <path class="area" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.slice(0,-1).map(p=>`<circle class="pt" cx="${X(p.d)}" cy="${Y(p.kg)}" r="3.5"/>`).join("")}
    <circle class="end" cx="${X(last.d)}" cy="${Y(last.kg)}" r="5.5"/>
    <text x="${L}" y="${H-6}">${fmtD(pts[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtD(last.d)}</text></svg>`;
}
function advice(){

  if(days<21)return `<div class="advice"><p>Servono almeno 3–4 settimane di misurazioni per capire la tendenza. Continua così.</p></div>`;
  const from=p.filter(x=>x.d>=last.d-60*DAY)[0]||first,span=Math.max(21,(last.d-from.d)/DAY);
  const rate=(last.kg-from.kg)/span*30,r=M.fmt(Math.abs(rate),1),sign=rate>=0?"+":"−";let msg,adj=0;
  if(P.obiettivo==="massa"){if(rate<0.2){msg=`Stai prendendo ${sign}${r} kg al mese: è poco per la massa. Aggiungi circa 150 kcal al giorno.`;adj=150}
    else if(rate>1){msg=`Stai prendendo ${r} kg al mese: un po' troppo veloce. Togli circa 150 kcal.`;adj=-150}else msg=`Ritmo giusto: ${sign}${r} kg al mese. Continua così.`}
  else if(P.obiettivo==="dimagrimento"){if(rate>-0.3){msg=`Il peso scende poco (${sign}${r} kg al mese). Togli circa 150 kcal al giorno.`;adj=-150}
    else if(rate<-1.2){msg=`Stai calando ${r} kg al mese: troppo in fretta. Aggiungi circa 150 kcal.`;adj=150}else msg=`Ritmo giusto: ${sign}${r} kg al mese. Continua così.`}
  else{if(Math.abs(rate)>0.5){adj=rate>0?-100:100;msg=`Il peso si sta muovendo (${sign}${r} kg al mese). Correggi di ${adj>0?"+":""}${adj} kcal.`}else msg=`Peso stabile (${sign}${r} kg al mese). Perfetto.`}
  return `<div class="advice ${adj?"act":"ok"}"><p>${msg}</p>${adj?`<div><button class="btn small primary" type="button" data-adj="${adj}">Applica ${adj>0?"+":""}${adj} kcal</button></div>`:""}</div>`;
}
$("advice").addEventListener("click",e=>{const b=e.target.closest("[data-adj]");if(!b)return;P.correzione=(P.correzione||0)+(+b.dataset.adj);M.save(P);renderDash();toast(`Fatto: obiettivo ora ${M.fmt(M.calc(P).kcal)} kcal. La dieta si è già adattata.`)});
function openW(){$("wForm").hidden=false;$("wOpen").hidden=true;$("wKg").value="";$("wKg").placeholder=String(M.lastW(P).kg).replace(".",",");
  $("wDate").value=isoToday();$("wDate").max=isoToday();$("wH").value="";$("wH").placeholder=P.altezza;$("wErr").hidden=true;
  $("wCard").scrollIntoView({block:"start",behavior:"smooth"});setTimeout(()=>$("wKg").focus(),250)}
document.addEventListener("click",e=>{if(e.target.closest("[data-open-w]"))openW()});
$("wCancel").addEventListener("click",()=>{$("wForm").hidden=true;$("wOpen").hidden=false});
$("wForm").addEventListener("submit",e=>{e.preventDefault();const kg=num($("wKg").value),hh=$("wH").value?Math.round(num($("wH").value)):null;
  const d=$("wDate").value?new Date($("wDate").value+"T09:00").getTime():Date.now();
  if(!(kg>=35&&kg<=250)){$("wErr").textContent="Inserisci il peso in kg, per esempio 61 o 61,4.";$("wErr").hidden=false;return}
  if(hh!==null&&!(hh>=120&&hh<=230)){$("wErr").textContent="Altezza in centimetri, per esempio 171.";$("wErr").hidden=false;return}
  const old=M.calc(P).kcal;if(hh)P.altezza=hh;P.pesi.push({d,kg});P.pesi.sort((a,b)=>a.d-b.d);M.save(P);renderDash();
  const nw=M.calc(P).kcal,diff=nw-old;toast(diff?`Peso salvato. Obiettivo ${diff>0?"salito":"sceso"} a ${M.fmt(nw)} kcal (${diff>0?"+":""}${diff}).`:"Peso salvato.")});
let delArm=-1;
$("hist").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;const i=+b.dataset.del;
  if(delArm!==i){delArm=i;b.textContent="Conferma";setTimeout(()=>{if(delArm===i){delArm=-1;renderDash()}},3000);return}
  delArm=-1;P.pesi.splice(i,1);M.save(P);renderDash();toast("Misurazione eliminata.")});

let tT;function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(tT);tT=setTimeout(()=>el.hidden=true,3500)}
function show(){
  const nav=document.querySelector(".mf-nav");
  if(!P){$("dash").hidden=true;if(nav)nav.hidden=true;startFlow("reg");return}
  $("flow").hidden=true;$("dash").hidden=false;if(nav)nav.hidden=false;renderDash();window.scrollTo(0,0);
}
M.nav("home");show();
</script>
