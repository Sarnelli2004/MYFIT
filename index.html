<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyFit</title><link rel="icon" href="icona-palestra-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@500;600&display=swap">
<style>
:root{--bg:#f2f3ef;--card:#fff;--ink:#1f2420;--muted:#5f6862;--g:#2f6b4f;--b:#3b4a5c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#131614;--card:#1c201d;--ink:#e8ece9;--muted:#9ca59f;--g:#7cc4a0;--b:#a9bbd0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px "Figtree",system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) 16px 24px}
main{max-width:480px;margin:0 auto;display:grid;gap:14px}
h1{font:800 1.7rem "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px}
p{color:var(--muted);margin:0 0 6px}
a{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);border:1px solid rgba(127,127,127,.2)}
a img{width:56px;height:56px;border-radius:14px}
a b{display:block;font-size:1.1rem}
a span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>MyFit</h1>
  <p>Apri un'app e aggiungila alla schermata Home da lì: avrai due icone separate.</p>
  <a href="pasti.html"><img src="icona-pasti-192.png" alt=""><div><b>Piano Pasti</b><span>Menu della settimana e alimenti equivalenti</span></div></a>
  <a href="allenamento.html"><img src="icona-palestra-192.png" alt=""><div><b>Scheda Palestra</b><span>Allenamenti, pesi e stretching</span></div></a>
</main>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});</script>
</body>
</html>
