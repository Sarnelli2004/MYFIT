<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyFit">
<link rel="manifest" href="manifest-myfit.webmanifest">
<link rel="apple-touch-icon" href="icona-myfit-180.png">
<link rel="icon" href="icona-myfit-192.png">
<title>Dieta · MyFit</title>
<script src="myfit.js"></script>
<script src="dieta.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: colonna unica stile app; giorni in alto, riepilogo, poi i pasti come liste di "porzioni" toccabili che aprono un pannello dal basso */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --ink:#1d2a22; --muted:#5f6d64; --line:#dde3da;
  --accent:#2f6b4f; --accent-soft:#e2eee6; --warm:#d9822b; --warm-soft:#fbeedd;
  --shadow:0 10px 30px rgba(29,42,34,.14);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1b231e; --ink:#e6ece7; --muted:#9aa89f; --line:#2c3730;
  --accent:#7cc4a0; --accent-soft:#213229; --warm:#f0a65a; --warm-soft:#33281b;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1b231e; --ink:#e6ece7; --muted:#9aa89f; --line:#2c3730;
  --accent:#7cc4a0; --accent-soft:#213229; --warm:#f0a65a; --warm-soft:#33281b;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.75rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.num{font-variant-numeric:tabular-nums}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days button{flex:1 0 auto;min-width:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 .85rem var(--f-body);padding:8px 10px;border-radius:999px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.days button:focus-visible,.slot:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--warm);outline-offset:2px}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}
.big small{font:500 .9rem var(--f-body);color:var(--muted);margin-left:4px}
.bar{height:10px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.macros{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.macros b{color:var(--ink);font-weight:600}

.meal{display:flex;flex-direction:column;gap:8px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal-head h2{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:0}
.meal-head{flex-wrap:wrap}
.meal-head h2{margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 .8rem var(--f-body);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--warm-soft);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--warm);outline-offset:-2px}
.meal-head .k{color:var(--muted);font-size:.9rem}
.meal-head .k.ok{color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slot{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;
  background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer}
.slot:first-child{border-top:0}
.slot:hover{background:var(--accent-soft)}
.slot .cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.slot .food{font-weight:600;min-width:0}
.slot .food em{font-style:normal;color:var(--accent)}
.slot .unit{font-size:.82rem;color:var(--muted)}
.slot .right{grid-row:1/span 3;grid-column:2;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

.foot{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer}
.daynote{margin:-6px 0 0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;text-wrap:balance}
.mnote{margin:0;color:var(--muted);font-size:.88rem;background:var(--warm-soft);padding:8px 12px;border-radius:10px}
.note{color:var(--muted);font-size:.85rem;margin:0}

/* pannello dal basso */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85%;border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar span{transition:none}}
.sheet-head{padding:16px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:12px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.sheet-head p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.x{border:0;background:var(--accent-soft);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:none}
.opts{overflow-y:auto;padding:6px 8px 12px}
.opt{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;border:0;background:none;
  padding:12px 10px;border-radius:12px;color:var(--ink);font:inherit;cursor:pointer}
.opt:hover{background:var(--accent-soft)}
.opt[aria-current="true"]{background:var(--warm-soft)}
.opt .n{font-weight:600}
.opt .d{font-size:.82rem;color:var(--muted)}
.opt .g{grid-row:1/span 2;grid-column:2;text-align:right}
.opt .g b{font-family:var(--f-display);font-size:1.15rem;display:block}
.opt .g span{font-size:.78rem;color:var(--muted)}
</style>
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>La tua dieta</h1>
    <p class="sub" id="forwho">Tocca una porzione per scegliere l'alimento: i grammi si adattano alle calorie del pasto.</p>
  </header>

  <nav class="days" id="days" aria-label="Giorno della settimana"></nav>

  <p class="daynote" id="daynote"></p>

  <section class="summary" aria-live="polite">
    <div class="sum-top">
      <div class="big num" id="tot">0<small>/ 2.600 kcal</small></div>
      <div class="macros"><span>Proteine <b class="num" id="prot">0 g</b></span><span>Obiettivo <b class="num" id="protT">100–120 g</b></span></div>
    </div>
    <div class="bar"><span id="barfill" style="width:0"></span></div>
  </section>

  <main id="meals" style="display:flex;flex-direction:column;gap:20px"></main>

  <div class="foot">
    <button class="btn" id="reset" type="button">Ripristina il menu del giorno</button>
  </div>
  <p class="note" id="msg">Grammi a crudo. Le scelte restano salvate in questo browser.</p>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sheet-head">
      <div><h3 id="sh-title"></h3><p id="sh-sub"></p></div>
      <button class="x" id="close" type="button" aria-label="Chiudi">✕</button>
    </div>
    <div class="opts" id="opts"></div>
  </div>
</div>

<script>
const D=window.Dieta, PROF=(window.MyFit&&MyFit.load())||null, CALC=PROF?MyFit.calc(PROF):null;
const PREFS=Object.assign({},D.DEF_PREFS,(PROF&&PROF.dieta)||{}), TARGET=CALC?CALC.kcal:2600;
const DAYS=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const fmtN=n=>String(n).replace(".",","), fmtK=n=>n.toLocaleString("it-IT");
let day=(new Date().getDay()+6)%7, sel={}, plan=null;
function load(){try{const s=JSON.parse(localStorage.getItem(D.SEL_KEY)||"null");if(s&&typeof s==="object")sel=s}catch(e){}DAYS.forEach((_,d)=>{sel[d]=sel[d]||{}})}
function save(){try{localStorage.setItem(D.SEL_KEY,JSON.stringify(sel))}catch(e){}}
const $=id=>document.getElementById(id);
function render(){
  $("days").innerHTML=DAYS.map((d,i)=>`<button type="button" data-d="${i}" aria-pressed="${i===day}">${d}</button>`).join("");
  plan=D.day(day,PREFS,sel[day],TARGET);
  $("daynote").textContent=D.dayTitle(plan);
  $("meals").innerHTML=plan.meals.map(m=>{
    const rows=m.items.map(it=>`<button class="slot" type="button" data-s="${it.key}">
        <span class="cat">${it.cat}</span>
        <span class="food">${it.name} <em class="num">${it.g} ${it.unit}</em></span>
        <span class="unit">${it.count||"&nbsp;"}</span>
        <span class="right"><span class="num">${it.kcal} kcal</span><i class="chev"></i></span>
      </button>`).join("");
    const isCol=m.id==="colazione"||m.id==="salata";
    return `<section class="meal"><div class="meal-head"><h2>${m.name}</h2>${isCol?`<span class="seg" role="group" aria-label="Tipo di colazione"><button type="button" data-style="dolce" aria-pressed="${m.style!=="salata"}">Dolce</button><button type="button" data-style="salata" aria-pressed="${m.style==="salata"}">Salata</button></span>`:""}
      <span class="k num ${Math.abs(m.kcal-m.target)<=15?"ok":""}">${m.kcal} / ${m.target} kcal</span></div>${m.note?`<p class="mnote">${m.note}</p>`:""}
      <div class="list">${rows}</div></section>`}).join("");
  $("tot").innerHTML=`${fmtK(plan.kcal)}<small>/ ${fmtK(TARGET)} kcal</small>`;
  $("prot").textContent=plan.prot+" g";
  $("barfill").style.width=Math.min(100,plan.kcal/TARGET*100)+"%";
}
let current=null, lastFocus=null;
function findItem(key){for(const m of plan.meals)for(const it of m.items)if(it.key===key)return [m,it];return [null,null]}
function openSheet(key){
  const [m,it]=findItem(key);if(!it)return;current=key;lastFocus=document.activeElement;
  $("sh-title").textContent=`${m.name} · ${it.cat}`;
  $("sh-sub").textContent=`Ogni alternativa vale circa ${it.kcal} kcal`;
  $("opts").innerHTML=it.list.map(id=>{const p=D.portion(id,it.kcal);
    return `<button class="opt" type="button" data-f="${id}" aria-current="${it.id===id}">
      <span class="n">${p.name}</span><span class="d num">${p.kcal} kcal · ${fmtN(p.prot)} g proteine</span>
      <span class="g"><b class="num">${p.g} ${p.unit}</b><span>${p.count}</span></span></button>`}).join("");
  $("scrim").hidden=false;$("close").focus();
}
function closeSheet(){$("scrim").hidden=true;current=null;if(lastFocus)lastFocus.focus()}
const MSG="Grammi a crudo. Le scelte restano salvate su questo telefono.";
function flash(t){$("msg").textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>$("msg").textContent=MSG,2500)}
$("days").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(b){day=+b.dataset.d;render()}});
$("meals").addEventListener("click",e=>{const t=e.target.closest("[data-style]");if(t){sel[day].style=t.dataset.style;save();render();const f=document.querySelector(`[data-style="${t.dataset.style}"]`);if(f)f.focus();return}
  const b=e.target.closest("[data-s]");if(b)openSheet(b.dataset.s)});
$("opts").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;
  sel[day][current]=b.dataset.f;save();const k=current;closeSheet();render();const el=document.querySelector(`[data-s="${k}"]`);if(el)el.focus()});
$("close").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",e=>{if(e.target===$("scrim"))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSheet()});
$("reset").addEventListener("click",()=>{sel[day]={};save();render();flash(DAYS[day]+": ripristinato il menu proposto.")});
load();render();$("msg").textContent=MSG;
(function(){const el=$("forwho");
  if(CALC){const ch=(PREFS.esig||[]).map(e=>D.LABELS.esig[e]);
    el.innerHTML=`Calcolata per <b>${PROF.nome}</b>: ${TARGET.toLocaleString("it-IT")} kcal al giorno${ch.length?" · "+ch.join(", ").toLowerCase():""}. Tocca una porzione per cambiare alimento.`;
    $("protT").textContent="≈ "+CALC.prot+" g";}
  else el.innerHTML=`Dieta base da 2.600 kcal. <a href="index.html">Crea il tuo profilo</a> per averla su misura.`;})();
</script>

<script>MyFit.nav("dieta");</script>
</body>
</html>
